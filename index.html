<script>
const music = document.getElementById('backgroundMusic');
let musicStarted = false;

function startMusic() {
    if (!musicStarted) {
        music.play();
        musicStarted = true;
    }
}

let currentScreen = "schermata-iniziale";

function mostraSchermata(nuovaSchermata) {
    document.getElementById(currentScreen).style.display = "none";
    document.getElementById(nuovaSchermata).style.display = "block";
    currentScreen = nuovaSchermata;
    history.pushState({screen: nuovaSchermata}, "", "");
    createParticles();
    
    // Coriandoli solo per i finali (con ritardo)
    if (nuovaSchermata === "risultato-2a" || 
        nuovaSchermata === "risultato-1a1" || 
        nuovaSchermata === "risultato-1b2" || 
        nuovaSchermata === "risultato-2a2" || 
        nuovaSchermata === "risultato-2a1" || 
        nuovaSchermata === "risultato-2b1") {
        setTimeout(() => {
            createConfetti();
        }, 500);
    }
}

// Crea particelle di sfondo
function createParticles() {
    for (let i = 0; i < 15; i++) {
        setTimeout(() => {
            let particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 3 + 's';
            particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
            document.body.appendChild(particle);
            
            setTimeout(() => particle.remove(), 10000);
        }, i * 100);
    }
}

// Crea coriandoli per i finali
function createConfetti() {
    const colors = ['#ff6b9d', '#c44569', '#f8b500', '#00d2ff', '#3742fa', '#2ed573'];
    
    for (let i = 0; i < 50; i++) {
        setTimeout(() => {
            let confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.top = '-10px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.width = (Math.random() * 10 + 5) + 'px';
            confetti.style.height = (Math.random() * 10 + 5) + 'px';
            confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
            confetti.style.animationDelay = (Math.random() * 0.5) + 's';
            document.body.appendChild(confetti);
            
            setTimeout(() => confetti.remove(), 4000);
        }, i * 30);
    }
}

// LIVELLO 1
function scelta1() {
    startMusic();
    mostraSchermata("risultato-1");
}

function scelta2() {
    startMusic();
    mostraSchermata("risultato-2");
}

// LIVELLO 2 - Da risultato-1
function scelta1a() {
    mostraSchermata("risultato-1a");
}

function scelta1b() {
    mostraSchermata("risultato-1b");
}

// LIVELLO 2 - Da risultato-2
function scelta2a() {
    mostraSchermata("risultato-2a");
}

function scelta2b() {
    mostraSchermata("risultato-2b");
}

// LIVELLO 3 - Da risultato-1a
function scelta1a1() {
    mostraSchermata("risultato-1a1");
}

function scelta1a2() {
    mostraSchermata("risultato-1a2");
}

// LIVELLO 3 - Da risultato-1b
function scelta1b1() {
    let suono = document.getElementById('suono1b1');
    suono.volume = 0.4;
    suono.play();
    
    setTimeout(() => {
        suono.pause();
        suono.currentTime = 0;
    }, 5000);
    
    mostraSchermata("risultato-1b1");
}

function scelta1b2() {
    let suono = document.getElementById('suono1b2');
    suono.play();
    
    setTimeout(() => {
        suono.pause();
        suono.currentTime = 0; 
    }, 5000);
    
    mostraSchermata("risultato-1b2");
}

// LIVELLO 3 - Da risultato-2a
function scelta2a1() {
    mostraSchermata("risultato-2a1");
}

function scelta2a2() {
    mostraSchermata("risultato-2a2");
}

// LIVELLO 3 - Da risultato-2b
function scelta2b1() {
    let suono = document.getElementById('suono2b1');
    suono.play();
    
    setTimeout(() => {
        suono.pause();
        suono.currentTime = 0; 
    }, 5000);
    
    mostraSchermata("risultato-2b1");
}

function scelta2b2() {
    mostraSchermata("risultato-2b2");
}

// Gestisce il pulsante "Indietro" del browser
window.addEventListener("popstate", function(event) {
    if (event.state && event.state.screen) {
        document.getElementById(currentScreen).style.display = "none";
        document.getElementById(event.state.screen).style.display = "block";
        currentScreen = event.state.screen;
    } else {
        document.getElementById(currentScreen).style.display = "none";
        document.getElementById("schermata-iniziale").style.display = "block";
        currentScreen = "schermata-iniziale";
    }
});

// Imposta lo stato iniziale
history.replaceState({screen: "schermata-iniziale"}, "", "");
createParticles();
</script>
